name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pinned toolchain versions (keep in sync with rust-toolchain.toml and docs/DEPLOYMENT.md).
  AGAVE_VERSION: v4.3.0
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    name: Rust formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo fmt --check --manifest-path benchmarks/ml-dsa-solana/validator/Cargo.toml

  clippy:
    name: Rust linting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  crypto:
    name: Cryptographic test vectors and host tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - name: ML-DSA-44 (NIST ACVP vectors, differential tests vs fips204 and RustCrypto ml-dsa)
        run: cargo test --locked --release -p qshield-mldsa
      - name: QSP-1 (property tests, known-answer vectors)
        run: cargo test --locked --release -p qshield-protocol
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: QSP-1 independent reference encoder
        run: python3 scripts/qsp1_reference.py

  sbf:
    name: Solana program build, integration tests and benchmarks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - name: Cache Agave tools and platform-tools
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.local/share/agave-${{ env.AGAVE_VERSION }}
            ~/.cache/solana
          key: agave-${{ env.AGAVE_VERSION }}-platform-tools-v1.57
      - name: Install Agave ${{ env.AGAVE_VERSION }}
        run: |
          DIR="$HOME/.local/share/agave-$AGAVE_VERSION"
          if [ ! -x "$DIR/solana-release/bin/cargo-build-sbf" ]; then
            mkdir -p "$DIR"
            curl -sSfL "https://github.com/anza-xyz/agave/releases/download/$AGAVE_VERSION/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar -xj -C "$DIR"
          fi
          echo "$DIR/solana-release/bin" >> "$GITHUB_PATH"
      - run: cargo-build-sbf --version
      - name: Build vault program for every cluster (SBPF v3)
        run: |
          for c in mainnet devnet testnet localnet; do
            cargo build-sbf --arch v3 --features cluster-$c --manifest-path programs/qshield-vault/Cargo.toml -- --locked
            sha256sum target/deploy/qshield_vault.so | sed "s/$/  (cluster-$c)/"
          done
      - name: Build benchmark program (SBPF v3)
        run: cargo build-sbf --arch v3 --manifest-path benchmarks/ml-dsa-solana/program/Cargo.toml -- --locked
      - name: Integration, adversarial and parsing tests (LiteSVM, localnet build)
        run: cargo test --locked --release -p qshield-vault
      - name: Rust SDK, CLI and relayer tests (LiteSVM, offline CLI flows, relayer over HTTP)
        run: cargo test --locked --release -p qshield-client -p qshield-cli -p qshield-relayer
      - name: Benchmark regression gate (fails above 1.4M CU)
        run: |
          cargo run --locked --release -p mldsa-bench-harness -- --keys 50 --out "$GITHUB_WORKSPACE/target/bench"
          QSHIELD_COSTS_OUT="$GITHUB_WORKSPACE/target/bench/vault-costs.json" cargo test --locked --release -p qshield-vault --test costs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-results
          path: target/bench/

  validator:
    name: End-to-end against solana-test-validator
    runs-on: ubuntu-24.04
    needs: sbf
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          workspaces: benchmarks/ml-dsa-solana/validator
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.local/share/agave-${{ env.AGAVE_VERSION }}
            ~/.cache/solana
          key: agave-${{ env.AGAVE_VERSION }}-platform-tools-v1.57
      - name: Install Agave ${{ env.AGAVE_VERSION }}
        run: |
          DIR="$HOME/.local/share/agave-$AGAVE_VERSION"
          if [ ! -x "$DIR/solana-release/bin/cargo-build-sbf" ]; then
            mkdir -p "$DIR"
            curl -sSfL "https://github.com/anza-xyz/agave/releases/download/$AGAVE_VERSION/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar -xj -C "$DIR"
          fi
          echo "$DIR/solana-release/bin" >> "$GITHUB_PATH"
      - name: Deploy and verify on a local validator
        run: KEYS=2 scripts/bench-validator.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.18.0
      - name: Install TypeScript SDK and web wallet dependencies
        run: |
          (cd sdk/typescript && npm ci)
          (cd apps/web && npm ci && npx playwright install --with-deps chromium)
      - name: End to end (CLI, relayer, TypeScript SDK, web wallet in Chromium; MVP flow, offline signing, SPL, rotation, close)
        run: scripts/cli-e2e.sh

  typescript:
    name: TypeScript SDK tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - name: Build the Rust CLI (cross-implementation signature check)
        working-directory: .
        run: cargo build --locked --release -p qshield-cli
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: npm audit
        run: npm audit --audit-level=low

  web:
    name: Web wallet (typecheck, unit tests, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.18.0"
      - run: npm ci
        working-directory: sdk/typescript
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web
      - name: npm audit
        run: npm audit --audit-level=low
        working-directory: apps/web

  security:
    name: Dependency audit (advisories, licenses, sources)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # cargo-deny pinned explicitly: older releases cannot parse CVSS 4.0
      # entries in the current RustSec database.
      - uses: taiki-e/install-action@a164de717a0ee9284c2d9db1c6016a4c339cd333 # v2.69.14
        with:
          tool: cargo-deny@0.18.9
      - run: cargo deny --locked check advisories licenses sources bans
      - name: No unsafe code in the trusted crates
        run: |
          grep -q '#!\[forbid(unsafe_code)\]' crates/qshield-mldsa/src/lib.rs
          grep -q '#!\[forbid(unsafe_code)\]' crates/qshield-protocol/src/lib.rs
          ! grep -rn "unsafe" programs/qshield-vault/src/

# The frontend build will be added together with apps/web (Phase 5).
