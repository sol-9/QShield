[package]
name = "qshield-cli"
description = "QShield command-line interface: PQ keys, vaults, offline signing"
version = "0.4.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "qshield"
path = "src/main.rs"

[dependencies]
qshield-client = { path = "../crates/qshield-client" }
qshield-vault = { path = "../programs/qshield-vault", features = ["no-entrypoint"] }
qshield-mldsa = { path = "../crates/qshield-mldsa", features = ["alloc"] }
clap = { version = "4.6", features = ["derive", "env"] }
rpassword = "7.5"
anyhow = "1"
hex = "0.4"
sha2 = "0.10"
serde_json = "1"
zeroize = "1.8"
solana-keypair = "3"
solana-pubkey = "4"
solana-signer = "3"

[dev-dependencies]
assert_cmd = "2.2"
tempfile = "3"
hex = "0.4"
