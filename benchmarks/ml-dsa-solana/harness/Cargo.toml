[package]
name = "mldsa-bench-harness"
description = "Runs the ML-DSA-44 SBF benchmark program in LiteSVM and writes a report"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
litesvm = "0.17"
solana-keypair = "3"
solana-signer = "3"
solana-pubkey = "4"
solana-instruction = "3"
solana-transaction = { version = "4", features = ["serde"] }
solana-message = { version = "4", features = ["serde"] }
solana-account = "4"
solana-compute-budget-interface = "3"
solana-hash = "4"
solana-compute-budget = "4"
mldsa-bench-fixtures = { path = "../fixtures" }
qshield-mldsa = { path = "../../../crates/qshield-mldsa" }
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
