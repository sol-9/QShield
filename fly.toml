# Fly.io app for the devnet relayer.
# Run from the repository root (it is the Docker build context):
#   fly launch --no-deploy --copy-config      (first time; pick a unique app name)
#   fly secrets set QSHIELD_RELAYER_KEYPAIR_JSON="$(cat deploy-keys/devnet/relayer.json)"
#   fly deploy
# Exactly one machine: request history and the per-vault queue live in memory.
app = "qshield-relayer-devnet"
primary_region = "cdg"

[build]
  dockerfile = "deploy/relayer/Dockerfile"

[env]
  QSHIELD_CLUSTER = "devnet"
  QSHIELD_RPC_URL = "https://api.devnet.solana.com"
  QSHIELD_PROGRAM_ID = "REPLACE_WITH_DEVNET_PROGRAM_ID"
  QSHIELD_RELAYER_MIN_FEE = "0"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
