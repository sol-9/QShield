[package]
name = "qshield-vault"
description = "QShield vault: Solana program whose withdrawals are authorized by ML-DSA-44 (QSP-1) signatures"
version = "0.3.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
# Exactly one cluster must be selected for SBF builds; the cluster id is
# compiled into the binary and enforced on every authorization (QSP-1 §4).
cluster-mainnet = []
cluster-devnet = []
cluster-testnet = []
cluster-localnet = []
# Exclude the entrypoint when the crate is used as a library by clients.
no-entrypoint = []

[dependencies]
qshield-mldsa = { path = "../../crates/qshield-mldsa", features = ["alloc"] }
qshield-protocol = { path = "../../crates/qshield-protocol" }
solana-account-info = "3.1"
solana-cpi = "3.1"
solana-instruction = "3.5"
solana-msg = "3.1"
solana-program-entrypoint = "3.1"
solana-program-error = "3.0"
solana-pubkey = "4"
solana-sha256-hasher = "3.1"
solana-sysvar = "4"
solana-clock = "3.2"
solana-rent = "4.4"
bytemuck = { version = "1.16", features = ["min_const_generics"] }

[target.'cfg(not(target_os = "solana"))'.dependencies]
solana-pubkey = { version = "4", features = ["curve25519"] }
solana-sha256-hasher = { version = "3.1", features = ["sha2"] }

[dev-dependencies]
litesvm = "0.17"
solana-keypair = "3"
solana-signer = "3"
solana-transaction = { version = "4", features = ["serde"] }
solana-message = { version = "4", features = ["serde"] }
solana-account = "4"
solana-compute-budget-interface = "3"
solana-system-interface = { version = "3", features = ["std"] }
solana-sdk-ids = "3"
qshield-protocol = { path = "../../crates/qshield-protocol", features = ["sha2"] }
fips204 = { version = "=0.4.6", default-features = false, features = ["ml-dsa-44", "default-rng"] }
rand = "0.8"
rand_chacha = "0.3"
proptest = "1"
bincode = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
