[package]
name = "qshield-mldsa"
description = "Verify-only, low-memory FIPS 204 ML-DSA-44 verifier suitable for the Solana SBF runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
# Enables `Workspace::boxed()` (heap allocation of the scratch workspace).
alloc = []

[dependencies]
sha3 = { version = "=0.10.8", default-features = false }

[dev-dependencies]
fips204 = { version = "=0.4.6", default-features = false, features = ["ml-dsa-44", "default-rng"] }
ml-dsa = { version = "=0.1.1" }
hex = "0.4"
serde_json = "1"
proptest = "1"
rand = "0.8"
rand_chacha = "0.3"
