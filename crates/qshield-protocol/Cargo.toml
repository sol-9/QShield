[package]
name = "qshield-protocol"
description = "QSP-1 (QShield Signing Protocol v1) canonical authorization encoding"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
# Off-chain helpers: SHA-256 key identifiers via the `sha2` crate.
sha2 = ["dep:sha2"]

[dependencies]
sha2 = { version = "0.10", default-features = false, optional = true }

[dev-dependencies]
proptest = "1"
sha2 = { version = "0.10" }
fips204 = { version = "=0.4.6", default-features = false, features = ["ml-dsa-44", "default-rng"] }
qshield-mldsa = { path = "../qshield-mldsa" }
serde_json = "1"
hex = "0.4"
