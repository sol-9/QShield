[package]
name = "qshield-client"
description = "Rust SDK for QShield: PQ keys, encrypted keystore, QSP-1 authorizations, vault transactions"
version = "0.4.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["http"]
# JSON-RPC client over HTTP(S). Disable for offline-only builds (e.g. air-gapped signers).
http = ["dep:ureq", "dep:base64"]

[dependencies]
qshield-mldsa = { path = "../qshield-mldsa", features = ["alloc"] }
qshield-protocol = { path = "../qshield-protocol", features = ["sha2"] }
qshield-vault = { path = "../../programs/qshield-vault", features = ["no-entrypoint"] }
fips204 = { version = "=0.4.6", default-features = false, features = ["ml-dsa-44", "default-rng"] }
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
zeroize = { version = "1.8", features = ["derive"] }
sha2 = "0.10"
getrandom = "0.2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
bs58 = "0.5"
solana-pubkey = "4"
solana-hash = "4"
solana-instruction = "3"
solana-keypair = "3"
solana-signer = "3"
solana-signature = "3"
solana-message = "4"
solana-transaction = { version = "4", features = ["wincode"] }
solana-compute-budget-interface = "3"
solana-system-interface = { version = "3", features = ["std", "wincode"] }
wincode = "0.6"
ureq = { version = "3", optional = true, features = ["json"] }
base64 = { version = "0.22", optional = true }

[dev-dependencies]
litesvm = "0.17"
solana-account = "4"
solana-clock = "3.2"
sha2 = "0.10"
